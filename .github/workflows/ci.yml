name: CI

on:
  push:
    branches: ['master', 'beta', 'codex/release-v1.14.0']
  pull_request:
    branches: ['master', 'beta']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # Release publishes windows and darwin binaries, but every job here runs on
      # ubuntu, so the !unix build was never even type-checked.
      - name: Vet non-unix build targets
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Security lint
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence medium ./...

      - name: Validate frontend and installer syntax
        run: |
          find web/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.js
          bash -n install.sh
          bash -n docker-entrypoint.sh
          bash -n tests/install_tls_test.sh
          bash -n tests/install_test.sh
          bash -n tests/install_proxy_test.sh
          bash -n tests/docker_entrypoint_test.sh
          bash -n tests/upstream_header_key_test.sh
          bash -n tests/dynamic_route_key_test.sh
          shellcheck install.sh docker-entrypoint.sh tests/install_tls_test.sh tests/install_test.sh tests/install_proxy_test.sh tests/docker_entrypoint_test.sh tests/upstream_header_key_test.sh tests/dynamic_route_key_test.sh
          bash tests/dynamic_route_key_test.sh
          bash tests/upstream_header_key_test.sh
          bash tests/install_test.sh
          shellcheck tests/install_rollback_test.sh
          bash tests/install_rollback_test.sh
          bash tests/install_proxy_test.sh
          bash tests/install_tls_test.sh

      - name: Test Docker entrypoint
        run: bash tests/docker_entrypoint_test.sh

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            base_version=$(sed -n 's/^var appVersion = "\([^"]*\)"$/\1/p' cmd/meridian/main.go)
            test -n "$base_version"
            version="${base_version}-beta.${GITHUB_SHA:0:7}"
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.appVersion=${version}" \
              -o meridian-linux-amd64 ./cmd/meridian
            test "$(./meridian-linux-amd64 --version)" = "$version"
            printf '%s\n' "$version" > BETA_VERSION
            sha256sum meridian-linux-amd64 > SHA256SUMS
          else
            go build -trimpath -buildvcs=false -o meridian ./cmd/meridian
          fi

      - name: Upload beta binary
        if: github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meridian-beta-linux-amd64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            meridian-linux-amd64
            BETA_VERSION
            SHA256SUMS

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          platforms: linux/amd64,linux/arm64
