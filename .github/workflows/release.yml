name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a safe prerelease suffix." >&2
            exit 1
          fi
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify and test
        run: |
          go mod verify
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          find web/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.js
          bash -n install.sh
          bash -n tests/install_test.sh
          bash -n tests/upstream_header_key_test.sh
          bash -n tests/dynamic_route_key_test.sh
          shellcheck install.sh tests/install_test.sh tests/upstream_header_key_test.sh tests/dynamic_route_key_test.sh
          bash tests/dynamic_route_key_test.sh
          bash tests/upstream_header_key_test.sh
          bash tests/install_test.sh

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Security lint
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence medium ./...

      - name: Build
        run: go build -trimpath -buildvcs=false -o meridian .

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -X main.appVersion=${RELEASE_TAG}" -o meridian-${{ matrix.suffix }} .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-${{ matrix.suffix }}
          path: meridian-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum meridian-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            meridian-*
            SHA256SUMS
          generate_release_notes: true

  docker:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
    env:
      IMAGE_NAME: ghcr.io/snnabb/meridian
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
