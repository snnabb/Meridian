name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本号（例如 v1.8.5）'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}
      commit_sha: ${{ steps.release_tag.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use exactly vMAJOR.MINOR.PATCH without a suffix." >&2
            exit 1
          fi
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify curated release notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: grep -Fxq "## ${RELEASE_TAG}" CHANGELOG.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify and test
        run: |
          go mod verify
          go test -race ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          find web/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.js
          bash -n install.sh
          bash -n docker-entrypoint.sh
          bash -n tests/install_test.sh
          bash -n tests/docker_entrypoint_test.sh
          bash -n tests/upstream_header_key_test.sh
          bash -n tests/dynamic_route_key_test.sh
          shellcheck install.sh docker-entrypoint.sh tests/install_test.sh tests/docker_entrypoint_test.sh tests/upstream_header_key_test.sh tests/dynamic_route_key_test.sh
          bash tests/dynamic_route_key_test.sh
          bash tests/upstream_header_key_test.sh
          bash tests/install_test.sh

      - name: Test Docker entrypoint
        run: bash tests/docker_entrypoint_test.sh

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Security lint
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence medium ./...

      - name: Build
        run: go build -trimpath -buildvcs=false -o meridian ./cmd/meridian

  build:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          build() {
            local goos="$1" goarch="$2" suffix="$3"
            echo "Building ${goos}/${goarch} -> meridian-${suffix}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.appVersion=${RELEASE_TAG}" \
              -o "meridian-${suffix}" ./cmd/meridian
          }
          build linux amd64 linux-amd64
          build linux arm64 linux-arm64
          build windows amd64 windows-amd64.exe
          build darwin amd64 darwin-amd64
          build darwin arm64 darwin-arm64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-release-binaries
          path: meridian-*

  release:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Generate checksums
        run: sha256sum meridian-* > SHA256SUMS

      - name: Sign checksums with Sigstore
        run: |
          go version
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.4
          "$(go env GOPATH)/bin/cosign" sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS

      - name: Extract curated release notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          awk -v heading="## ${RELEASE_TAG}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          files: |
            meridian-*
            SHA256SUMS
            SHA256SUMS.bundle
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md

  docker:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
      contents: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meridian
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
